---
- name: Enable IPv4 forwarding permanently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-wireguard-vpn.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  register: vpn_sysctl_config

- name: Apply IPv4 forwarding setting
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-wireguard-vpn.conf
  when: vpn_sysctl_config.changed
